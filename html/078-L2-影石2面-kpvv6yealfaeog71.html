ue299bbbd">​</span><br></p><p data-lake-id="ua113a7f4" id="ua113a7f4"><strong><span data-lake-id="u2bc489bb" id="u2bc489bb">q2:我们这里主要是做数据湖的数据开发工作，举一个场景，假如我们有一个几亿数据的文件，能直接上传到你的这个项目里，然后说帮我做某某方面的数据处理，你觉得你的项目能够完成这个任务吗？</span></strong></p><p data-lake-id="u049087b2" id="u049087b2"><span data-lake-id="u67d58eb5" id="u67d58eb5">本质上并不是agent能不能处理，而是agent能不能选择能够解决该场景的工具，据我所知，如果有一种mcp工具是接入spark的计算型数据开发工具，然后接入到我这个项目里之后，如果决策应该调用它的时候，那么大概率就会成功。</span></p>
